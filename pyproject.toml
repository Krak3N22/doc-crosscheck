[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-crosscheck"
version = "0.1.0"
description = "Modular toolkit and web UI for cross-referencing tables, exports, and text documents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "openpyxl>=3.1.2",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
crosscheck = "crosscheck.cli:main"
